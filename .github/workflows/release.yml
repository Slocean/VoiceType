name: release

# 推 v* tag 自动发布；也可在 Actions 页手动触发（仅构建，不发 Release）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 依赖
        uses: Swatinem/rust-cache@v2

      # 纯逻辑与发布门禁测试，无需音频设备与窗口。
      - name: 运行单元测试
        shell: pwsh
        run: |
          cargo test --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 核对版本与更新公告
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            python scripts/verify_release.py --tag "$env:GITHUB_REF_NAME"
          } else {
            python scripts/verify_release.py
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      # 模型随 exe 内置（embedded-models feature），下载源文件供编译期嵌入。
      - name: Release 构建
        shell: pwsh
        run: |
          ./scripts/prepare-models.ps1
          cargo build --release -p voicetype-tray --features embedded-models

      # 便携版 zip + 裸 exe + 安装版，全部自带模型，产物带 .sha256 清单。
      # E：打包到唯一空目录（与安装包同目录），禁止复用旧 dist 文件。
      - name: 打包
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP ("release-" + [Guid]::NewGuid().ToString("N"))
          if (Test-Path $dir) { throw "候选目录不是空目录" }
          ./scripts/package.ps1 -OutDir $dir -SkipBuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PKG_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 验证最终资产与内置模型
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            python scripts/verify_release.py --tag "$env:GITHUB_REF_NAME" --dist "$env:PKG_DIR"
          } else {
            python scripts/verify_release.py --dist "$env:PKG_DIR"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:VOICETYPE_MODEL_DIR = Join-Path $env:RUNNER_TEMP 'voicetype-smoke-models'
          $check = Start-Process -FilePath (Join-Path $env:PKG_DIR 'voicetype-tray.exe') -ArgumentList '--self-check' -Wait -PassThru -WindowStyle Hidden
          Remove-Item -LiteralPath $env:VOICETYPE_MODEL_DIR -Recurse -Force -ErrorAction SilentlyContinue
          if ($check.ExitCode -ne 0) { throw "最终便携 exe 的模型解压或识别引擎初始化失败（退出码 $($check.ExitCode)）" }

      # 从 app_update.json 提取当前 tag 的更新公告作为 Release 正文。
      - name: 生成更新公告
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: python scripts/release_notes.py "$env:GITHUB_REF_NAME" (Join-Path $env:PKG_DIR 'release_body.md')

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: voicetype-win-x64
          path: |
            ${{ env.PKG_DIR }}/voicetype-win-x64-portable.zip
            ${{ env.PKG_DIR }}/voicetype-setup-x64.exe
            ${{ env.PKG_DIR }}/voicetype-tray.exe
            ${{ env.PKG_DIR }}/*.sha256

      - name: 创建 GitHub Release（仅 tag 推送）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ env.PKG_DIR }}/release_body.md
          files: |
            ${{ env.PKG_DIR }}/voicetype-win-x64-portable.zip
            ${{ env.PKG_DIR }}/voicetype-win-x64-portable.zip.sha256
            ${{ env.PKG_DIR }}/voicetype-setup-x64.exe
            ${{ env.PKG_DIR }}/voicetype-setup-x64.exe.sha256
            ${{ env.PKG_DIR }}/voicetype-tray.exe
            ${{ env.PKG_DIR }}/voicetype-tray.exe.sha256
