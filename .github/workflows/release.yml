name: release

# 推 v* tag 自动发布；也可在 Actions 页手动触发（仅构建，不发 Release）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 依赖
        uses: Swatinem/rust-cache@v2

      # 纯逻辑测试（状态机/Mock），无需音频设备与窗口。
      - name: 运行单元测试
        run: cargo test -p voicetype-asr

      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Release 构建
        run: cargo build --release -p voicetype-tray

      # 便携版 zip + 裸 exe + 安装版 + 两种带模型变体，全部产物带 .sha256 清单。
      - name: 打包
        shell: pwsh
        run: ./scripts/package.ps1 -SkipBuild -WithModels

      # 从 app_update.json 提取当前 tag 的更新公告作为 Release 正文。
      - name: 生成更新公告
        shell: pwsh
        run: python scripts/release_notes.py "$env:GITHUB_REF_NAME" dist/release_body.md

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: voicetype-win-x64
          path: |
            dist/voicetype-win-x64-portable.zip
            dist/voicetype-win-x64-portable-with-models.zip
            dist/voicetype-setup-x64.exe
            dist/voicetype-setup-x64-with-models.exe
            dist/voicetype-tray.exe
            dist/*.sha256

      - name: 创建 GitHub Release（仅 tag 推送）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release_body.md
          files: |
            dist/voicetype-win-x64-portable.zip
            dist/voicetype-win-x64-portable.zip.sha256
            dist/voicetype-win-x64-portable-with-models.zip
            dist/voicetype-win-x64-portable-with-models.zip.sha256
            dist/voicetype-setup-x64.exe
            dist/voicetype-setup-x64.exe.sha256
            dist/voicetype-setup-x64-with-models.exe
            dist/voicetype-setup-x64-with-models.exe.sha256
            dist/voicetype-tray.exe
            dist/voicetype-tray.exe.sha256
