name: release

# 推 v* tag 自动发布；也可在 Actions 页手动触发（仅构建，不发 Release）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 依赖
        uses: Swatinem/rust-cache@v2

      # 纯逻辑测试（状态机/Mock），无需音频设备与窗口。
      - name: 运行单元测试
        run: cargo test -p voicetype-asr

      - name: Release 构建
        run: cargo build --release -p voicetype-tray

      - name: 打包
        shell: pwsh
        run: ./scripts/package.ps1 -SkipBuild

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: voicetype-win-x64
          path: dist/voicetype-win-x64.zip

      - name: 创建 GitHub Release（仅 tag 推送）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/voicetype-win-x64.zip
          generate_release_notes: true