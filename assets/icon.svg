<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- VoiceType 应用图标：靛紫渐变圆角底 + 白色麦克风与声波 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- 圆角底 -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>

  <!-- 右声波（外层半透明） -->
  <path d="M222 78 a76 76 0 0 1 0 100" fill="none" stroke="#FFFFFF" stroke-opacity="0.45"
        stroke-width="10" stroke-linecap="round"/>
  <path d="M200 92 a52 52 0 0 1 0 72" fill="none" stroke="#FFFFFF" stroke-opacity="0.85"
        stroke-width="10" stroke-linecap="round"/>

  <!-- 左声波 -->
  <path d="M34 78 a76 76 0 0 0 0 100" fill="none" stroke="#FFFFFF" stroke-opacity="0.45"
        stroke-width="10" stroke-linecap="round"/>
  <path d="M56 92 a52 52 0 0 0 0 72" fill="none" stroke="#FFFFFF" stroke-opacity="0.85"
        stroke-width="10" stroke-linecap="round"/>

  <!-- 麦克风：拾音头 -->
  <rect x="104" y="56" width="48" height="88" rx="24" fill="#FFFFFF"/>
  <!-- 麦克风：U 型支架 -->
  <path d="M84 108 v14 a44 44 0 0 0 88 0 v-14" fill="none" stroke="#FFFFFF"
        stroke-width="12" stroke-linecap="round"/>
  <!-- 麦克风：杆与底座 -->
  <rect x="122" y="160" width="12" height="26" rx="6" fill="#FFFFFF"/>
  <rect x="98" y="188" width="60" height="12" rx="6" fill="#FFFFFF"/>
</svg>
